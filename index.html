<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Cuentas Club Diablos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style id="css">
/* Layout: encabezado con escudo, próximo partido, resumen en cifras, luego una sección por cuenta (liga, cuota, multa, préstamo, fondo, uniformes, arbitraje). Un solo tema oscuro del club. */
:root {
  --ink: #0c0a0b;
  --panel: #171314;
  --raise: #211b1c;
  --line: #342b2c;
  --fg: #f1ead8;
  --muted: #a99f97;
  --red: #c4161c;
  --red-soft: #ff6d70;
  --ok: #7fd68f;
  --ok-bg: rgba(127, 214, 143, 0.12);
  --due-bg: rgba(255, 109, 112, 0.12);
  --display: "Anton", Impact, "Arial Narrow", sans-serif;
  --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
body { background: var(--ink); color: var(--fg); font-family: var(--body); font-size: 15.5px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--red-soft); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding-block: 0 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px; }

.hero { display: flex; align-items: center; gap: 14px; padding-block: 20px 14px; border-bottom: 3px solid var(--red); }
.hero img { width: 64px; height: 64px; flex: none; }
.hero h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1; letter-spacing: 0.02em; }
.hero p { margin: 4px 0 0; color: var(--muted); font-family: var(--cond); font-weight: 600; font-size: 15px; letter-spacing: 0.02em; }

.match { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
.match .tag { flex: none; font-family: var(--cond); font-weight: 700; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--red-soft); }
.match .what { font-family: var(--cond); font-weight: 700; font-size: 19px; line-height: 1.15; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
.tile b { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-size: 13.5px; line-height: 1.3; }
.tile.red b { color: var(--red-soft); }
.tile.green b { color: var(--ok); }
.bar { grid-column: 1 / -1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.bar .lab { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--muted); }
.bar .lab b { color: var(--fg); font-variant-numeric: tabular-nums; }
.track { height: 10px; border-radius: 99px; background: var(--raise); overflow: hidden; }
.fill { height: 100%; background: linear-gradient(90deg, var(--red), var(--red-soft)); border-radius: 99px; }

nav.jump { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
nav.jump::-webkit-scrollbar { display: none; }
nav.jump a { flex: none; text-decoration: none; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 5px 11px; font-family: var(--cond); font-weight: 600; font-size: 14.5px; background: var(--panel); }

section.s { display: grid; gap: 10px; scroll-margin-top: 12px; }
.s > h2 { margin: 6px 0 0; display: flex; align-items: baseline; gap: 10px; font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: 0.02em; line-height: 1.1; }
.s > h2 small { font-family: var(--cond); font-weight: 600; font-size: 14px; color: var(--muted); letter-spacing: 0.04em; }
.s > p { margin: 0; color: var(--muted); max-width: 62ch; }
.s > p strong { color: var(--fg); font-weight: 600; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 11px 14px; border-top: 1px solid var(--line); }
.rows li:first-child { border-top: 0; }
.rows .t { font-weight: 600; }
.rows .d { grid-column: 1 / 2; color: var(--muted); font-size: 13.5px; line-height: 1.35; }
.rows .m { grid-row: 1 / 3; grid-column: 2; text-align: right; display: grid; align-content: start; gap: 3px; justify-items: end; }
.rows .m b { font-variant-numeric: tabular-nums; font-weight: 700; }
.rows li.tot { background: var(--raise); }
.rows li.tot .t { font-family: var(--cond); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; font-size: 14px; }

.rows .m .sub { color: var(--muted); font-size: 12px; margin-top: -3px; }
.pl .t { display: flex; align-items: baseline; gap: 8px; }
.pl .dn { font-family: var(--display); color: var(--red-soft); font-size: 14px; min-width: 22px; }
.pl .d { padding-left: 30px; }
.pl .cs { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-left: 30px; }
.pl .owe { color: var(--red-soft); font-size: 16px; }
.lbl2 { font-family: var(--cond); font-weight: 600; font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.chip { display: inline-block; border-radius: 6px; padding: 1px 7px; font-family: var(--cond); font-weight: 700; font-size: 13px; letter-spacing: 0.03em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.due { background: var(--due-bg); color: var(--red-soft); }
.chip.na { background: var(--raise); color: var(--muted); }

.tblwrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
th { text-align: left; font-family: var(--cond); font-weight: 700; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 9px 10px; background: var(--raise); }
td { padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
td.num, th.num { text-align: right; }
td .n { font-weight: 600; }
td .n i { font-style: normal; font-family: var(--display); color: var(--red-soft); font-size: 13px; margin-right: 6px; }
td .why { display: block; color: var(--muted); font-size: 12.5px; }

.steps { list-style: none; margin: 0; padding: 0; counter-reset: st; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.steps li:first-child { border-top: 0; }
.steps li::before { content: counter(st); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--raise); font-family: var(--cond); font-weight: 700; font-size: 14px; color: var(--muted); }
.steps li.done::before { content: "✓"; background: var(--ok-bg); color: var(--ok); }
.steps li.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }

.note { border-left: 3px solid var(--red); background: var(--panel); border-radius: 0 10px 10px 0; padding: 10px 14px; color: var(--muted); font-size: 14.5px; }
.note strong { color: var(--fg); }

.foot { color: var(--muted); font-size: 13px; text-align: center; padding-top: 6px; }

/* edición (solo el administrador) */
.adminbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding-block: 8px; background: var(--ink); }
.adminbar .st { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }
.adminbar .st.dirty { color: var(--red-soft); }
.adminbar .st.ok { color: var(--ok); }
.btn { border: 0; border-radius: 10px; padding: 8px 14px; background: var(--red); color: var(--fg); cursor: pointer; font-family: var(--cond); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn:disabled { opacity: 0.45; cursor: default; }
.ed { width: 82px; background: var(--ink); border: 1px solid var(--red); border-radius: 6px; padding: 3px 6px; text-align: right; font-variant-numeric: tabular-nums; }
.edt { width: 100%; background: var(--ink); border: 1px solid var(--red); border-radius: 6px; padding: 5px 8px; }
.edc { width: 18px; height: 18px; accent-color: var(--red); vertical-align: middle; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
@media (max-width: 380px) { .tile b { font-size: 24px; } .hero h1 { font-size: 26px; } }

/* cuenta por jugador */
.plist { display: grid; }
.pl2 { border-top: 1px solid var(--line); }
.pl2:first-child { border-top: 0; }
.pl2 > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto 14px; gap: 8px; align-items: center; padding: 12px 14px; }
.pl2 > summary::-webkit-details-marker { display: none; }
.pl2 > summary .dn { font-family: var(--display); color: var(--red-soft); font-size: 15px; }
.pl2 > summary .nm { font-weight: 600; font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl2 > summary .ar { color: var(--muted); font-size: 12px; transition: transform 0.15s ease; }
.pl2[open] > summary .ar { transform: rotate(90deg); }
.pl2[open] > summary { background: var(--raise); }
.acct { list-style: none; margin: 0; padding: 4px 14px 12px 52px; display: grid; gap: 6px; background: var(--raise); }
.acct li { display: flex; justify-content: space-between; gap: 12px; font-size: 14.5px; }
.acct li span:first-child { color: var(--muted); }
.acct li b { font-variant-numeric: tabular-nums; }
.acct li.sum { border-top: 1px solid var(--line); padding-top: 6px; }
.acct li.res b { font-size: 16px; }
.acct li.res.due b { color: var(--red-soft); }
.acct li.res.ok b { color: var(--ok); }
.acct .why { color: var(--muted); font-size: 13px; }
.big { font-family: var(--display); font-weight: 400; font-size: 26px; }
@media (prefers-reduced-motion: reduce) { .pl2 > summary .ar { transition: none; } }
</style>

<script id="app-js">(function () {

  function money(n) { var r = Math.round(n * 100) / 100; var s = Math.abs(r).toLocaleString("es-MX", { minimumFractionDigits: r % 1 ? 2 : 0, maximumFractionDigits: 2 }); return (r < 0 ? "−$" : "$") + s; }
  function sum(a, f) { return a.reduce(function (t, x) { return t + (+f(x) || 0); }, 0); }
  function fecha(iso) { try { var d = new Date(iso); return d.toLocaleDateString("es-MX", { day: "numeric", month: "long", year: "numeric" }) + ", " + d.toLocaleTimeString("es-MX", { hour: "numeric", minute: "2-digit" }); } catch (e) { return iso; } }

  function calc() {
    var S = state, ps = S.players;
    var nm = ps.filter(function (p) { return p.multa; }).length;
    var share = nm ? S.multaTotal / nm : 0;
    ps.forEach(function (p) { p._toca = S.cuota + (p.multa ? share : 0); p._saldo = (p.aportado || 0) - p._toca; });
    var aportado = sum(ps, function (p) { return p.aportado; });
    var ligaPag = sum(S.liga, function (x) { return x.pagado; });
    var gastosPag = sum(S.gastos, function (x) { return x.pagado; });
    return {
      share: share, nm: nm, aportado: aportado, ligaPag: ligaPag, gastosPag: gastosPag,
      caja: aportado - ligaPag - gastosPag,
      falta: sum(ps, function (p) { return Math.max(0, -p._saldo); }),
      favor: sum(ps, function (p) { return Math.max(0, p._saldo); }),
      ligaFalta: sum(S.liga, function (x) { return Math.max(0, x.costo - x.pagado); }),
      meta: sum(ps, function (p) { return p._toca; })
    };
  }
  function amt(v, path) { return editing ? '<input class="ed" type="number" inputmode="decimal" min="0" step="1" data-path="' + path + '" value="' + (v || 0) + '" aria-label="Monto">' : "<b>" + money(v) + "</b>"; }
  function status(p) {
    if (p._saldo > 0.005) return '<span class="chip ok">A favor ' + money(p._saldo) + "</span>";
    if (p._saldo < -0.005) return '<span class="chip due">Le falta ' + money(-p._saldo) + "</span>";
    return '<span class="chip ok">Al corriente</span>';
  }

          : p._saldo < -0.005 ? '<li class="res due"><span>Le falta</span><b>' + money(-p._saldo) + "</b></li>"
          : '<li class="res ok"><span>Al corriente</span><b>$0</b></li>';
        return '<details class="pl2" data-i="' + i + '"' + (editing || openSet[i] ? " open" : "") + '><summary><span class="dn">' + esc(p.d || "–") + '</span><span class="nm">' + esc(p.n) + "</span>" + status(p) + '<span class="ar" aria-hidden="true">▶</span></summary>' +
          '<ul class="acct"><li><span>Cuota</span><b>' + money(S.cuota) + "</b></li>" + multaLine +
          '<li class="sum"><span>Le toca en total</span><b>' + money(p._toca) + "</b></li>" +
          "<li><span>Ha dado</span>" + amt(p.aportado, "players." + i + ".aportado") + "</li>" + res + "</ul></details>";
      }).join("") + "</div>" +
      "<p>" + esc(S.porteroNota || "") + "</p></section>";

    /* caja */
    h += '<section class="s" id="caja"><h2>Caja del equipo</h2><p>Todo lo que han dado los jugadores y en qué se ha usado.</p><div class="card"><ul class="rows">' +
      '<li><span class="t">Lo que han dado los jugadores</span><span class="d">Suma de las cuotas y multas entregadas</span><span class="m"><b>' + money(C.aportado) + "</b></span></li>" +
      '<li><span class="t">Pagado a la liga</span><span class="d">Inscripción, credenciales y parte de la multa</span><span class="m"><b>−' + money(C.ligaPag) + "</b></span></li>" +
      S.gastos.filter(function (x) { return x.pagado > 0; }).map(function (x) { return '<li><span class="t">' + esc(x.label) + '</span><span class="d">' + esc(x.desc) + '</span><span class="m"><b>−' + money(x.pagado) + "</b></span></li>"; }).join("") +
      '<li class="tot"><span class="t">Hay en caja</span><span class="d">Se usa para el siguiente pago a la liga</span><span class="m"><b class="big">' + money(C.caja) + "</b></span></li></ul></div></section>";

    /* liga */
    var ligaTot = sum(S.liga, function (x) { return x.costo; });
    h += '<section class="s" id="liga"><h2>Lo que cobra la liga</h2><div class="card"><ul class="rows">' +
      S.liga.map(function (x, i) {
        var f = Math.max(0, x.costo - x.pagado);
        return '<li><span class="t">' + esc(x.label) + " · " + money(x.costo) + '</span><span class="d">' + esc(x.desc) + '</span><span class="m">' + amt(x.pagado, "liga." + i + ".pagado") + (f ? '<span class="chip due">Faltan ' + money(f) + "</span>" : '<span class="chip ok">Pagado</span>') + "</span></li>";
      }).join("") +
      '<li class="tot"><span class="t">Total liga</span><span class="d">' + money(C.ligaPag) + " pagado de " + money(ligaTot) + '</span><span class="m"><b>' + money(C.ligaFalta) + '</b><span class="chip due">Por pagar</span></span></li></ul></div></section>';

    /* cuota */
    var cubre = S.liga.filter(function (x) { return x.k !== "multa"; }).concat(S.gastos);
    var cubreTot = sum(cubre, function (x) { return x.costo; });
    h += '<section class="s" id="cuota"><h2>Por qué la cuota es de ' + money(S.cuota) + "</h2><p>" + esc(S.cuotaNota || "") + "</p>" +
      '<div class="card"><ul class="rows">' +
      cubre.map(function (x) {
        var g = S.gastos.indexOf(x);
        return '<li><span class="t">' + esc(x.label) + '</span><span class="d">' + esc(x.short || x.desc) + '</span><span class="m"><b>' + money(x.costo) + "</b>" + (g > -1 && editing ? amt(x.pagado, "gastos." + g + ".pagado") : "") + "</span></li>";
      }).join("") +
      '<li class="tot"><span class="t">Total</span><span class="d">Entre ' + S.players.length + " jugadores = " + money(cubreTot / S.players.length) + ' cada uno</span><span class="m"><b>' + money(cubreTot) + "</b></span></li></ul></div></section>";

    /* multa */
    var pagan = S.players.filter(function (p) { return p.multa; }).map(function (p) { return p.n; });
    var exentos = S.players.filter(function (p) { return !p.multa; }).map(function (p) { return p.n; });
    h += '<section class="s" id="multa"><h2>La multa del 13 de septiembre</h2>' +
      "<p>Ese partido no se jugó porque no completamos. La liga cobraba <strong>$3,000</strong> y la dejó en <strong>" + money(S.multaTotal) + "</strong>. La pagan los que estaban en el equipo y no confirmaron ese partido.</p>" +
      '<div class="card"><ul class="rows">' +
      '<li><span class="t">La pagan (' + pagan.length + ')</span><span class="d">' + esc(pagan.join(", ")) + '</span><span class="m"><b>' + money(C.share) + '</b><span class="chip na">cada uno</span></span></li>' +
      '<li><span class="t">No la pagan (' + exentos.length + ')</span><span class="d">Confirmaron ese partido o llegaron después: ' + esc(exentos.join(", ")) + '</span><span class="m"><span class="chip ok">$0</span></span></li>' +
      "</ul></div><p>Se puede pagar en dos partes: la mitad antes del partido del 25 de octubre y el resto antes del 1 de noviembre.</p></section>";

    /* destino */
    h += '<section class="s" id="destino"><h2>A dónde va cada pago</h2><p>Conforme entra el dinero se paga en este orden.</p><div class="card"><ol class="steps">' +
      S.orden.map(function (k) {
        var x = S.liga.filter(function (y) { return y.k === k; })[0] || S.gastos.filter(function (y) { return y.k === k; })[0];
        var falta = Math.max(0, x.costo - x.pagado);
        return '<li class="' + (falta <= 0 ? "done" : "") + '"><span class="t">' + esc(x.label) + "</span>" + (falta <= 0 ? '<span class="chip ok">Listo</span>' : '<span class="chip due">' + money(falta) + "</span>") + "</li>";
      }).join("") +
      (C.favor > 0.005 ? '<li><span class="t">Regresar lo que algunos dieron de más</span><span class="chip ok">' + money(C.favor) + "</span></li>" : "") +
      "</ol></div></section>";

    /* uniformes */
    h += '<section class="s" id="uniformes"><h2>Uniformes <small>cuenta aparte</small></h2><p>Los uniformes no tocan el dinero de la liga. El que quiera uniforme lo paga completo al pedirlo: $480, o $530 con manga larga.</p>' +
      '<div class="card"><ul class="rows">' +
      S.uniformes.map(function (u, i) {
        var s = (u.pagado || 0) - u.costo;
        var saldo = u.pend && !(u.pagado > 0) ? '<span class="chip na">' + esc(u.pend) + "</span>" : s > 0.005 ? '<span class="chip ok">' + money(s) + " a favor</span>" : s < -0.005 ? '<span class="chip due">Debe ' + money(-s) + "</span>" : '<span class="chip ok">Pagado</span>';
        return '<li><span class="t">' + esc(u.n) + " · " + money(u.costo) + '</span><span class="d">' + esc(u.items) + " · " + (editing ? '<input class="edt" data-path="uniformes.' + i + '.estado" value="' + esc(u.estado) + '" aria-label="Estado">' : esc(u.estado)) + '</span><span class="m">' + (editing ? amt(u.pagado, "uniformes." + i + ".pagado") : "") + saldo + "</span></li>";
      }).join("") + "</ul></div></section>";

    /* arbitraje */
    h += '<section class="s" id="arbitraje"><h2>Arbitraje de cada partido</h2><p>No sale de la cuota. Se paga en efectivo en la cancha antes de cada partido y se divide entre los que juegan. Sin el papel de pagado, el árbitro no inicia el partido.</p>' +
      '<div class="card"><ul class="rows"><li><span class="t">Un árbitro</span><span class="d">Si el equipo se porta bien</span><span class="m"><b>$725</b></span></li><li><span class="t">Tripleta</span><span class="d">Árbitro y dos abanderados</span><span class="m"><b>$850</b></span></li><li><span class="t">Permiso sin credencial</span><span class="d">Por jugador, por partido</span><span class="m"><b>$20</b></span></li></ul></div></section>';

    h += '<p class="foot">Dudas o aclaraciones, por privado con Metra (#17).</p>';
    $("app").innerHTML = h;
  }

  function setPath(path, val) {
    var ks = path.split("."), o = state;
    for (var i = 0; i < ks.length - 1; i++) o = o[isNaN(ks[i]) ? ks[i] : +ks[i]];
    o[ks[ks.length - 1]] = val;
  }
  document.addEventListener("change", function (e) {
    var t = e.target, p = t.getAttribute && t.getAttribute("data-path"); if (!p) return;
    var v = t.type === "checkbox" ? t.checked : t.type === "number" ? Math.max(0, parseFloat(t.value) || 0) : t.value;
    setPath(p, v); dirty = true;
    var y = window.scrollY; render(); window.scrollTo(0, y);
  });
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.id === "edit") { editing = true; render(); }
    else if (b.id === "cancel") { if (dirty) { location.reload(); return; } editing = false; render(); }
    else if (b.id === "save") save();
  });

  var RESET = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,-apple-system,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}";
  function buildDoc() {
    var out = JSON.parse(JSON.stringify(state));
    out.players.forEach(function (p) { Object.keys(p).forEach(function (k) { if (k.charAt(0) === "_") delete p[k]; }); });
    out.updated = new Date().toISOString();
    var SC = "<" + "/script>";
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + "</style></head><body>" +
      '<title>Cuentas Club Diablos</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">\n' +
      '<style id="css">' + $("css").textContent + "</style>\n" + '<main id="app" class="wrap"></main>\n' +
      '<script type="application/json" id="crest">' + $("crest").textContent + SC + "\n" +
      '<script type="application/json" id="state">' + JSON.stringify(out).replace(/</g, "\\u003c") + SC + "\n" +
      '<script id="app-js">' + $("app-js").textContent + SC + "\n</body></html>";
  }
  function save() {
    if (!artifactNs) return;
    var b = $("save"); if (b) b.disabled = true;
    artifactNs.publish(buildDoc()).then(function () { dirty = false; }, function (err) {
      var c = err && err.code;
      if (c === "conflict") return;
      if (c === "not_writer" || c === "not_granted" || c === "not_declared" || c === "capability_disabled" || c === "consent_required") { canEdit = false; editing = false; render(); return; }
      if (b) b.disabled = false;
      var st = document.querySelector(".adminbar .st"); if (st) st.textContent = c === "rate_limited" ? "Espera un momento y vuelve a guardar" : "No se pudo guardar. Intenta otra vez.";
    });
  }

  render();
  if (window.claude && typeof window.claude.use === "function") {
    Promise.all([window.claude.use("user"), window.claude.use("artifact")]).then(function (r) {
      var u = r[0]; artifactNs = r[1];
      if (!u || !artifactNs) return;
      u.canEdit().then(function (ok) { canEdit = !!ok; if (canEdit) render(); }, function () {});
    }, function () {});
  }
})();
</script>
</body>
</html>
